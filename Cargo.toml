[package]
name = "bosun"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Engine-agnostic, agent-ergonomic Docker MCP server with token-bounded I/O"
authors = ["Nhat-Vu <nhatvu148@gmail.com>"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/nhatvu148/bosun"
keywords = ["mcp", "docker", "containers", "agent", "llm"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
anyhow = "1.0.104"
bollard = "0.21.0"
chrono = { version = "0.4.45", default-features = false, features = ["std"] }
clap = { version = "4.6.5", features = ["derive"] }
futures-util = "0.3.33"
rmcp = { version = "3.1.0", features = ["server", "transport-io", "macros", "schemars", "elicitation"] }
schemars = "1.2.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.19"
tokio = { version = "1.53.1", features = [
    "rt-multi-thread",
    "macros",
    "signal",
    "io-std",
    "time",
    "process",
] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[profile.release]
lto = "thin"
strip = true
