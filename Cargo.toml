[package]
name = "kagoni"
version = "0.2.0"
edition = "2024"
rust-version = "1.88"
description = "Engine-agnostic, agent-ergonomic Docker MCP server with token-bounded I/O"
authors = ["Nhat-Vu <nhatvu148@gmail.com>"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/nhatvu148/kagoni"
keywords = ["mcp", "docker", "containers", "agent", "llm"]
categories = ["command-line-utilities", "development-tools"]

# The crate is kagoni; so is the binary. Stated explicitly so a future
# crate rename cannot silently change the command people type.
[[bin]]
name = "kagoni"
path = "src/main.rs"

[features]
default = []
# Remote daemons over ssh:// and https://. Off by default: it pulls ~34 crates
# (rustls, ring, openssh) and ~1.7 MB that a local-socket user never touches.
# Local paths, unix:// and plain tcp:// work without it.
remote = ["bollard/ssh", "bollard/ssl"]

[dependencies]
anyhow = "1.0.104"
bollard = { version = "0.21.0" }
chrono = { version = "0.4.45", default-features = false, features = ["std"] }
clap = { version = "4.6.5", features = ["derive", "env"] }
futures-util = "0.3.33"
rmcp = { version = "3.1.0", features = ["server", "transport-io", "macros", "schemars", "elicitation"] }
schemars = "1.2.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.19"
tokio = { version = "1.53.1", features = [
    "rt-multi-thread",
    "macros",
    "signal",
    "io-std",
    "time",
    "process",
] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[profile.release]
lto = "thin"
strip = true
