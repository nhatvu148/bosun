# Diagnostic fixture: a container killed by the kernel OOM killer.
#
# Exercises diagnose_container's highest-priority branch. The container exits
# 137 AND has State.OOMKilled=true — the pair that distinguishes a real OOM from
# a `docker stop` that timed out, which also exits 137. A correct diagnosis says
# "out of memory", not "killed by SIGKILL".
#
#   docker compose -p bosun-fixture-oom -f oom.compose.yml up -d
#   sleep 5
#   # then, in Claude Code: diagnose_container(id="bosun-oom")
#   docker compose -p bosun-fixture-oom -f oom.compose.yml down
#
# NOTE: needs a Linux container runtime with memory cgroup accounting. On
# Docker Desktop / OrbStack / Colima this works inside their Linux VM.

services:
  oom:
    image: busybox:latest
    container_name: bosun-oom
    restart: "no"
    # 16 MB ceiling, then allocate well past it. The tmpfs write counts against
    # the cgroup's memory budget, so the kernel OOM-kills the process.
    mem_limit: 16m
    memswap_limit: 16m
    command: >
      sh -c "echo 'starting memory hog';
             dd if=/dev/zero of=/dev/shm/fill bs=1M count=512"

  # Contrast case: exits 137 from SIGKILL WITHOUT being OOM-killed. A diagnosis
  # that keys only on the exit code will wrongly call this an OOM; one that
  # checks State.OOMKilled will not.
  sigkill-not-oom:
    image: busybox:latest
    container_name: bosun-sigkill-not-oom
    restart: "no"
    # Ignores SIGTERM, so `docker stop` escalates to SIGKILL after the timeout.
    command: sh -c "trap '' TERM; echo 'ignoring SIGTERM'; sleep 3600"
